<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FsBulletML2 Playground</title>
    <base href="/">
    <link rel="stylesheet" href="css/playground.css">
    <script type="importmap"></script>
  </head>
  <body>
    <div class="page">
      <h1>FsBulletML2 Playground</h1>
      <div class="row">
        <canvas id="stage" width="480" height="640"></canvas>
        <div class="editor">
        <select id="pattern" onchange="playground.pick()">
          <option value="">（XML 編集 / Open）</option>
        </select>
        <!-- 中身は空。**XML を html に書かない** —— 起動時の本文は host が
             同梱カタログの CE から焼いて渡す（Main.fs の InitialSource） -->
        <div id="source" class="source"></div>
        </div>
      </div>
      <div class="bar">
        <button type="button" onclick="playground.call('Play')">Play</button>
        <button type="button" onclick="playground.call('Pause')">Pause</button>
        <button type="button" onclick="playground.call('Reset')">Reset</button>
        <button type="button" onclick="playground.apply()">Apply</button>
        <button type="button" onclick="playground.open()">Open</button>
        <input id="open-file" type="file" accept=".xml,text/xml,application/xml" hidden>
        <span>FPS: <span id="fps">0</span></span>
        <span>Bullets: <span id="bullet-count">0</span></span>
        <span class="error" id="loop-error">起動待ち</span>
      </div>
      <div id="main"></div>
    </div>
    <!--
      Monaco は CDN。**版はこの 1 行 だけに在る** —— `Monaco.fs` はこの src から
      vsBase を読むので、上げるときここだけ直す。repo に本体を置かないのは、
      guard-text が見る追跡ファイルに binary を足さないため
    -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.56.0/min/vs/loader.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <!--
      **ここにロジックを書かない。** 読み込むだけ。
      WASM を起こすのは Playground.js（Fable）の末尾 ——
      html に書くと、そこだけ型も検査も掛からない
    -->
    <script type="module">import "./js/Playground.js";</script>
  </body>
</html>
