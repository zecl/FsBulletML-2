name: PR

# 変更されたコードから、走らせる試験を機械が決める。
# 決め方は .github/scripts/affected.ps1、その校正は affected.Tests.ps1。
# **対応表を手で書かない** —— 参照が変わったとき表だけが古びるのを避けるため。
#
# ## runner は self-hosted（Windows）
#
# 全 job を手元の Windows 機で走らせる。
#
# 正本は infra/gha-runner/README.md。契約は 3 つ ——
#
#     labels        runs-on: [self-hosted, windows, fsbulletml2]
#                   install-runner.ps1 の -Label と対。片方 だけ変えると
#                   job は永遠に queued（赤ではないが緑にもならない）
#     actions/cache 使わない。手元の runner ではクラウドへの往復のほうが遅く、
#                   素のホストなら既定の置き場（~/.nuget/packages）が最初から残る
#     setup-dotnet  使わない。SDK はホストに在り、global.json を満たさなければ
#                   dotnet 自身 が落ちる（黙って別の SDK で建つことはない）
#
# **土 は変えていない。** 4 job は windows-latest で走っていたものをそのまま
# Windows の runner へ移しただけ —— Linux へ移すと門の 3 か所（`\bin\Release\`）と
# 773 件 の試験が初めて別の軸に載る。「止まっているものを外す」と
# 「走ったことのない軸を増やす」を混ぜない。

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 選ばずに全部 走らせる
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select
    runs-on: [self-hosted, windows, fsbulletml2]
    outputs:
      tests: ${{ steps.pick.outputs.tests }}
      builds: ${{ steps.pick.outputs.builds }}
      full: ${{ steps.pick.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 載せ忘れたプロジェクトは CI から見ると存在しない。緑のまま素通りする
      - name: slnx から漏れた proj が無いか
        shell: pwsh
        run: ./.github/scripts/guard-slnx.ps1

      # NUL が 1 個 入るとそのファイルは git から binary に見えて差分が読めなくなる。
      # 走りはするので、目でも試験でも出ない
      - name: 生の制御文字が入っていないか
        shell: pwsh
        run: ./.github/scripts/guard-text.ps1

      # 機械に貼り付いた絶対パスは、書いた人の手元では完全に緑になる。
      # repo を別の場所に置いた人、道具を別のドライブに入れた人でだけ落ちる
      - name: その機械にしか無い絶対パスが入っていないか
        shell: pwsh
        run: ./.github/scripts/guard-abs-paths.ps1

      # 判断する側そのものの校正。**これが赤いときは、下の緑を信じてはいけない**
      - name: 選ぶ道具の校正
        shell: pwsh
        run: ./.github/scripts/affected.Tests.ps1

      - name: 締めの校正
        shell: pwsh
        run: ./.github/scripts/gate.Tests.ps1

      - name: 制御文字の門の校正
        shell: pwsh
        run: ./.github/scripts/guard-text.Tests.ps1

      - name: 絶対パスの門の校正
        shell: pwsh
        run: ./.github/scripts/guard-abs-paths.Tests.ps1

      # ブラウザ側が守ると決めた線。**どれも目で確かめると書いてあったもの** ——
      # 手書きの .js、Core からの表示側への参照、Fable 側の要素名、
      # html に書いた起動のロジック、例外の文面を字で出す設定
      - name: Playground の線
        shell: pwsh
        run: ./.github/scripts/guard-playground-boundaries.ps1

      - name: Playground の門の校正
        shell: pwsh
        run: ./.github/scripts/guard-playground-boundaries.Tests.ps1

      # **build も dotnet test も落ちない形。** wasm はスレッドが 1 本 しか
      # 無いので、待つ書き方は押した瞬間に画面ごと止まる（v1.0 で踏んだ）
      - name: ブラウザで止まる待ち方が無いか
        shell: pwsh
        run: ./.github/scripts/guard-wasm-blocking.ps1

      - name: その門の校正
        shell: pwsh
        run: ./.github/scripts/guard-wasm-blocking.Tests.ps1
      # キーだけで回る人には、フォーカスが当たった口の名前しか手がかりが無い。
      # **画面に字が在っても、口に結びついていなければ届かない** ——
      # 包む label / aria-label / 口の中の字 の 3 通り を見る（v2.4.3）
      - name: 操作の口に名前が在るか
        shell: pwsh
        run: ./.github/scripts/guard-control-names.ps1

      - name: その門の校正
        shell: pwsh
        run: ./.github/scripts/guard-control-names.Tests.ps1

      - name: 変更から選ぶ
        id: pick
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          $opt = @{}
          if ($env:FORCE_FULL -eq 'true') {
            $opt['ForceFull'] = $true
          } else {
            $base = git merge-base "origin/$env:BASE_REF" HEAD
            if (-not $base) { throw "merge-base が引けない: origin/$env:BASE_REF" }
            Write-Host "起点 $base （origin/$env:BASE_REF との merge-base）"
            $opt['Base'] = $base
          }
          ./.github/scripts/affected.ps1 @opt | Out-Null

  test:
    name: Test · ${{ matrix.project.label }}
    needs: select
    if: needs.select.outputs.tests != '[]'
    runs-on: [self-hosted, windows, fsbulletml2]
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.select.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
      - name: dotnet test
        run: dotnet test ${{ matrix.project.path }} -c Release --logger "trx;LogFileName=${{ matrix.project.name }}.trx"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: trx-${{ matrix.project.name }}
          path: '**/TestResults/*.trx'

  # 試験が 1 本 も触らないサンプルとベンチ。**Core の公開型を変えたときに
  # ここが壊れる** —— 試験は通るのに使う側が build できない、が起きる層
  build:
    name: Build · ${{ matrix.project.label }}
    needs: select
    if: needs.select.outputs.builds != '[]'
    runs-on: [self-hosted, windows, fsbulletml2]
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.select.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build ${{ matrix.project.path }} -c Release

      # **build が通ることと、publish した物が起動することは別だった。**
      #
      # SDK は publish のとき資産に指紋を付け、素の名前との対応をインラインの
      # importmap で html に入れる。Playground の CSP は 'unsafe-inline' を
      # 出していないのでそれが効かず、**publish 成果物だけが「起動待ち」で
      # 止まっていた** —— build でも dev server でも出ない（dev は指紋を付けない）。
      #
      # ここまで来ないと出ないので、Playground のときだけ publish して見る。
      #
      # **step を割る。** 1 つ の `run:` に 3 行 並べると、pwsh は最後の
      # exit code しか返さない —— 門が落ちても、後ろの校正が通れば緑になる
      - name: publish する
        if: matrix.project.label == 'Playground'
        run: dotnet publish ${{ matrix.project.path }} -c Release -o ${{ runner.temp }}/pub

      - name: publish した物が起動する形か
        if: matrix.project.label == 'Playground'
        shell: pwsh
        run: ./.github/scripts/guard-published-boot.ps1 -PublishDir ${{ runner.temp }}/pub

      - name: その門の校正
        if: matrix.project.label == 'Playground'
        shell: pwsh
        run: ./.github/scripts/guard-published-boot.Tests.ps1 -PublishDir ${{ runner.temp }}/pub

  # 同梱 dll に対して Unity C# のソースを compile し直す。
  # **Unity が見るのと同じものを参照する** —— 焼き忘れると、ソースは新しい
  # 名前を指し dll は古い名前しか持たない状態になる（実際に 2 回 やっている）。
  #
  # **選ばずに毎回 走らせる。** Core を参照しないので数秒で終わるし、
  # 条件を書くと「選ばれなかったから skip」と「壊れて skip」が混ざる。
  # 焼き直しは .github/scripts/bake-unity-dlls.ps1。
  shipped:
    name: Shipped DLLs
    runs-on: [self-hosted, windows, fsbulletml2]
    steps:
      # **浅く取らない。** 下の校正が、stub を割る前の dll を過去の commit から
      # 取り出して当てる —— 既定の深さ 1 だとその blob が無くて落ちる
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: dotnet build samples/FsBulletML2.Sample.Unity2D.CSharp.Compile -c Release -p:UseShippedDlls=true

      # 同梱 dll が、名乗りどおりのアセンブリから型を引いているか。
      # stub のアセンブリ名がずれると、そのずれが dll に焼き込まれて
      # Unity でだけ落ちる（上の build は stub を参照するので、そちらは
      # 最後まで緑になる）。
      #
      # **この job に置く理由が在る。** 上の build が 7 本 の stub を焼くので、
      # 突き合わせる表の材料がここにしか無い —— 選ぶ job へ戻すと材料が消える。
      #
      # 門は出力を `\bin\Release\` で絞っている。いまは runner が Windows なので
      # 当たるが、**区切りが `/` の機械では 1 本 も拾えない** ——
      # Linux へ移すときはここと guard-stub-shape.ps1 の 2 か所 を直す
      # （infra/gha-runner/README.md の「なぜ Windows なのか」）
      - name: 同梱 dll の参照先
        shell: pwsh
        run: ./.github/scripts/guard-shipped-refs.ps1

      - name: 同梱 dll の門の校正
        shell: pwsh
        run: ./.github/scripts/guard-shipped-refs.Tests.ps1

  # **1 本 のソースが 2 つ の runtime で走る。片方 しか測らないのは穴。**
  # fable/XmlScan.fs は .NET（波線）と焼いた JS（補完・hover）の両方 で走るが、
  # Build · Playground.Js は build するだけで、**焼いた出力を誰も走らせていない**。
  # 同じ入力を両方 に通して答えを突き合わせる。
  #
  # **選ばずに毎回 走らせる。** 焼くのは fable だけなので WASM workload が要らず
  # 数秒で終わる。条件を書くと「選ばれなかったから skip」と「壊れて skip」が混ざる。
  parity:
    name: Fable Parity
    runs-on: [self-hosted, windows, fsbulletml2]
    steps:
      - uses: actions/checkout@v4
      # **Playground まるごとは建てない。** あちらは WASM workload が要る。
      # 焼くのに要るのは Fable 側の proj だけ
      - name: 焼く
        working-directory: src/FsBulletML2.Playground
        run: |
          dotnet tool restore
          dotnet tool run fable -- fable/FsBulletML2.Playground.Js.fsproj -o wwwroot/js

      - name: 焼いた JS と .NET の突き合わせ
        shell: pwsh
        run: ./.github/scripts/guard-fable-parity.ps1

      - name: 突き合わせの門の校正
        shell: pwsh
        run: ./.github/scripts/guard-fable-parity.Tests.ps1

      # **共有リンクの圧縮は片方 の runtime にしか無い。** `CompressionStream` は
      # .NET に無いので、`dotnet test` を何本 増やしても 1 度 も通らない。
      # 焼いた JS が此処に在るので、同じ job で走らせる
      - name: 共有リンクの往復
        shell: pwsh
        run: ./.github/scripts/guard-share-roundtrip.ps1

      - name: 往復の門の校正
        shell: pwsh
        run: ./.github/scripts/guard-share-roundtrip.Tests.ps1

  # 枝分かれした job をまとめて 1 つ の必須チェックにする。
  # **skipped を成功として数えない** —— 選ばれなかったのか、落ちて飛ばされたのかは
  # 別のことなので、select の結果を見て分ける
  gate:
    name: Gate
    needs: [select, test, build, shipped, parity]
    if: always()
    runs-on: [self-hosted, windows, fsbulletml2]
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          SELECT: ${{ needs.select.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          SHIPPED: ${{ needs.shipped.result }}
          PARITY: ${{ needs.parity.result }}
          TESTS: ${{ needs.select.outputs.tests }}
          BUILDS: ${{ needs.select.outputs.builds }}
        run: ./.github/scripts/gate.ps1
