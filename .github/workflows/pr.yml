name: PR

# 変更されたコードから、走らせる試験を機械が決める。
# 決め方は .github/scripts/affected.ps1、その校正は affected.Tests.ps1。
# **対応表を手で書かない** —— 参照が変わったとき表だけが古びるのを避けるため。

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 選ばずに全部 走らせる
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: 選ぶ
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.pick.outputs.tests }}
      builds: ${{ steps.pick.outputs.builds }}
      full: ${{ steps.pick.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 載せ忘れたプロジェクトは CI から見ると存在しない。緑のまま素通りする
      - name: slnx から漏れた proj が無いか
        shell: pwsh
        run: ./.github/scripts/guard-slnx.ps1

      # NUL が 1 個 入るとそのファイルは git から binary に見えて差分が読めなくなる。
      # 走りはするので、目でも試験でも出ない
      - name: 生の制御文字が入っていないか
        shell: pwsh
        run: ./.github/scripts/guard-text.ps1

      # 機械に貼り付いた絶対パスは、書いた人の手元では完全に緑になる。
      # repo を別の場所に置いた人、道具を別のドライブに入れた人でだけ落ちる
      - name: その機械にしか無い絶対パスが入っていないか
        shell: pwsh
        run: ./.github/scripts/guard-abs-paths.ps1

      # 判断する側そのものの校正。**これが赤いときは、下の緑を信じてはいけない**
      - name: 選ぶ道具の校正
        shell: pwsh
        run: ./.github/scripts/affected.Tests.ps1

      - name: 締めの校正
        shell: pwsh
        run: ./.github/scripts/gate.Tests.ps1

      - name: 制御文字の門の校正
        shell: pwsh
        run: ./.github/scripts/guard-text.Tests.ps1

      - name: 絶対パスの門の校正
        shell: pwsh
        run: ./.github/scripts/guard-abs-paths.Tests.ps1

      # 同梱 dll が、名乗りどおりのアセンブリから型を引いているか。
      # stub のアセンブリ名がずれると、そのずれが dll に焼き込まれて
      # Unity でだけ落ちる（-p:UseShippedDlls=true の build は stub を
      # 参照するので、そちらは最後まで緑になる）
      - name: 同梱 dll の参照先
        shell: pwsh
        run: ./.github/scripts/guard-shipped-refs.ps1

      - name: 同梱 dll の門の校正
        shell: pwsh
        run: ./.github/scripts/guard-shipped-refs.Tests.ps1
      - name: 変更から選ぶ
        id: pick
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          $opt = @{}
          if ($env:FORCE_FULL -eq 'true') {
            $opt['ForceFull'] = $true
          } else {
            $base = git merge-base "origin/$env:BASE_REF" HEAD
            if (-not $base) { throw "merge-base が引けない: origin/$env:BASE_REF" }
            Write-Host "起点 $base （origin/$env:BASE_REF との merge-base）"
            $opt['Base'] = $base
          }
          ./.github/scripts/affected.ps1 @opt | Out-Null

  test:
    name: 試験 ${{ matrix.project.name }}
    needs: select
    if: needs.select.outputs.tests != '[]'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.select.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: dotnet test
        run: dotnet test ${{ matrix.project.path }} -c Release --logger "trx;LogFileName=${{ matrix.project.name }}.trx"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: trx-${{ matrix.project.name }}
          path: '**/TestResults/*.trx'

  # 試験が 1 本 も触らないサンプルとベンチ。**Core の公開型を変えたときに
  # ここが壊れる** —— 試験は通るのに使う側が build できない、が起きる層
  build:
    name: build ${{ matrix.project.name }}
    needs: select
    if: needs.select.outputs.builds != '[]'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.select.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet build ${{ matrix.project.path }} -c Release

  # 同梱 dll に対して Unity C# のソースを compile し直す。
  # **Unity が見るのと同じものを参照する** —— 焼き忘れると、ソースは新しい
  # 名前を指し dll は古い名前しか持たない状態になる（実際に 2 回 やっている）。
  #
  # **選ばずに毎回 走らせる。** Core を参照しないので数秒で終わるし、
  # 条件を書くと「選ばれなかったから skip」と「壊れて skip」が混ざる。
  # 焼き直しは .github/scripts/bake-unity-dlls.ps1。
  shipped:
    name: 同梱 dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet build samples/FsBulletML2.Sample.Unity2D.CSharp.Compile -c Release -p:UseShippedDlls=true

  # 枝分かれした job をまとめて 1 つ の必須チェックにする。
  # **skipped を成功として数えない** —— 選ばれなかったのか、落ちて飛ばされたのかは
  # 別のことなので、select の結果を見て分ける
  gate:
    name: 締め
    needs: [select, test, build, shipped]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          SELECT: ${{ needs.select.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          SHIPPED: ${{ needs.shipped.result }}
          TESTS: ${{ needs.select.outputs.tests }}
          BUILDS: ${{ needs.select.outputs.builds }}
        run: ./.github/scripts/gate.ps1
